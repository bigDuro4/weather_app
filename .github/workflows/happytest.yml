name: Run Tests
on: [push, pull_request] # This tells GitHub WHEN to run the tests

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install pytest  # Add other dependencies if needed
      - name: Run tests
        run: pytest

